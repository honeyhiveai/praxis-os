[tox]
envlist = py313,lint,type
skipsdist = True

[testenv]
deps =
    pytest>=8.0
    pytest-cov>=4.0
    pytest-asyncio>=0.21
    tiktoken>=0.5.0
    -r dist/ouroboros/requirements.txt
commands =
    pytest .praxis-os/tests/ouroboros/ -v --cov=dist.ouroboros --cov-report=term-missing --cov-report=html

[testenv:unit]
description = Run unit tests only (exclude integration tests)
commands =
    pytest .praxis-os/tests/ouroboros/ -v --cov=dist.ouroboros --cov-report=term-missing --ignore=.praxis-os/tests/ouroboros/integration/

[testenv:integration]
description = Run integration tests only
passenv = 
    HONEYHIVE_API_KEY
    HONEYHIVE_PROJECT
commands =
    pytest .praxis-os/tests/ouroboros/integration/ -v

[testenv:lint]
description = Run linting checks
deps =
    pylint>=3.0
    black>=23.0
    isort>=5.0
skip_install = True
commands =
    black --check dist/ouroboros/ scripts/
    isort --check-only dist/ouroboros/ scripts/
    pylint dist/ouroboros/ --fail-under=10

[testenv:type]
description = Run type checking
deps =
    mypy>=1.0
    types-PyYAML
    -r dist/ouroboros/requirements.txt
commands =
    mypy dist/ouroboros/ --ignore-missing-imports

[testenv:format]
description = Auto-format code
deps =
    black>=23.0
    isort>=5.0
skip_install = True
commands =
    black dist/ouroboros/ scripts/
    isort dist/ouroboros/ scripts/

[testenv:coverage]
description = Generate coverage report
deps =
    pytest>=8.0
    pytest-cov>=4.0
    -r dist/ouroboros/requirements.txt
commands =
    pytest .praxis-os/tests/ouroboros/ --cov=dist.ouroboros --cov-report=html --cov-report=term
    python -c "print('\nCoverage report: htmlcov/index.html')"
